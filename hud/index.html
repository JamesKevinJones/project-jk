<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.K. Console</title>
<link rel="stylesheet" href="/hud.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23E4E6E1'/><rect x='4' y='6' width='24' height='3' fill='%2314181A'/><rect x='4' y='13' width='16' height='3' fill='%2314181A'/><rect x='4' y='20' width='20' height='3' fill='%231D6B39'/></svg>">
</head>
<body data-state="boot">

<!-- ── master bar ─────────────────────────────────────────────── -->
<header class="master">
  <div class="mast">
    <span class="mast-name" id="agentName">J.K.</span>
    <span class="mast-sub">memory console</span>
  </div>

  <ul class="lamps" id="lamps" aria-label="System lamps"></ul>

  <div class="master-right">
    <label class="find" for="search">
      <span class="find-label">filter</span>
      <input id="search" type="search" autocomplete="off" spellcheck="false"
             aria-label="Filter priorities, jobs and projects">
      <kbd>/</kbd>
    </label>
    <span class="clock" id="clock">--:--:--</span>
    <button class="key" id="refresh" type="button">Refresh</button>
  </div>
</header>

<main class="console" id="console" aria-busy="true">

  <!-- ── hero: the status block ──────────────────────────────── -->
  <section class="mod mod-status" aria-labelledby="statusHead">
    <h2 class="mod-head" id="statusHead">Memory status</h2>
    <div class="status-body">
      <div class="status-word">
        <p class="verdict" id="verdict">CHECKING</p>
        <p class="verdict-sub" id="verdictSub">reading vault</p>
      </div>
      <dl class="status-figs">
        <div><dt>notes</dt><dd id="f-notes">—</dd></div>
        <div><dt>links</dt><dd id="f-links">—</dd></div>
        <div><dt>words</dt><dd id="f-words">—</dd></div>
        <div><dt>checks</dt><dd id="f-checks">—</dd></div>
      </dl>
    </div>
  </section>

  <section class="mod mod-faults" aria-labelledby="faultHead">
    <h2 class="mod-head" id="faultHead">Faults &amp; advisories <b id="faultMeta"></b></h2>
    <div class="mod-body scroll" id="faults"></div>
  </section>

  <!-- ── channel strip ───────────────────────────────────────── -->
  <section class="mod mod-strip" aria-labelledby="stripHead">
    <h2 class="mod-head" id="stripHead">Channels</h2>
    <div class="strip" id="strip"></div>
  </section>

  <!-- ── row 3 ───────────────────────────────────────────────── -->
  <section class="mod mod-open" aria-labelledby="openHead">
    <h2 class="mod-head" id="openHead">Open work <b id="prMeta"></b></h2>
    <div class="mod-body scroll" id="priorities"></div>
  </section>

  <section class="mod mod-jobs" aria-labelledby="jobHead">
    <h2 class="mod-head" id="jobHead">Jobs <b id="jobMeta"></b></h2>
    <div class="mod-body scroll" id="jobs"></div>
  </section>

  <section class="mod mod-dist" aria-labelledby="distHead">
    <h2 class="mod-head" id="distHead">Distribution <b>notes per folder</b></h2>
    <div class="mod-body scroll" id="dist"></div>
  </section>

  <!-- ── row 4 ───────────────────────────────────────────────── -->
  <section class="mod mod-log" aria-labelledby="logHead">
    <h2 class="mod-head" id="logHead">Daily log <b id="dailyMeta"></b></h2>
    <div class="mod-body scroll" id="daily"></div>
  </section>

  <section class="mod mod-proj" aria-labelledby="projHead">
    <h2 class="mod-head" id="projHead">Projects <b id="projMeta"></b></h2>
    <div class="mod-body scroll" id="projects"></div>
  </section>

  <section class="mod mod-graph" aria-labelledby="graphHead">
    <h2 class="mod-head" id="graphHead">Link graph <b id="graphMeta"></b></h2>
    <div class="graph-wrap">
      <canvas id="constellation" aria-hidden="true"></canvas>
      <p class="graph-note" id="graphNote"></p>
    </div>
  </section>

</main>

<footer class="footline">
  <span id="footLeft"></span>
  <span class="path" id="vaultPath"></span>
</footer>

<div class="sheet" id="detail" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
    <button class="key sheet-close" id="detailClose" type="button">Close <kbd>esc</kbd></button>
    <p class="sheet-kicker" id="detailKicker"></p>
    <h3 id="detailTitle"></h3>
    <div id="detailBody"></div>
  </div>
</div>

<script src="/hud.js"></script>
</body>
</html>
